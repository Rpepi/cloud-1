- name: Set default UFW inbound
  community.general.ufw:
    direction: incoming
    policy: deny


- name: Set default UFW outbound
  community.general.ufw:
    direction: outgoing
    policy: allow


- name: Allow SSH port
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp


- name: Allow HTTP port
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp


- name: Allow HTTPS port
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp


- name: Enable UFW
  community.general.ufw:
    state: enabled
